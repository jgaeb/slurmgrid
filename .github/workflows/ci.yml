name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and coverage
        run: pip install -e ".[dev]" coverage

      - name: Run unit tests with coverage
        run: coverage run -m unittest discover -s tests -v
        env:
          PYTHONPATH: .

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  slurm-integration:
    name: Slurm integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone slurm-docker-cluster
        run: git clone --depth 1 https://github.com/giovtorres/slurm-docker-cluster.git /tmp/slurm-docker

      - name: Get slurm-docker-cluster version
        id: slurm-version
        run: echo "sha=$(git -C /tmp/slurm-docker rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache Docker build
        uses: actions/cache@v4
        with:
          path: /tmp/slurm-docker-cache
          key: slurm-docker-${{ steps.slurm-version.outputs.sha }}

      - name: Load cached Docker image
        run: |
          if [ -f /tmp/slurm-docker-cache/slurm-docker-cluster.tar ]; then
            echo "Loading cached image..."
            docker load -i /tmp/slurm-docker-cache/slurm-docker-cluster.tar
          else
            echo "No cache found, will build from scratch"
          fi

      - name: Start Slurm cluster
        working-directory: /tmp/slurm-docker
        run: |
          docker compose up -d
          echo "Waiting for Slurm cluster to initialize..."
          # Wait for slurmctld to be healthy
          for i in $(seq 1 60); do
            if docker compose exec -T slurmctld sinfo --noheader 2>/dev/null | grep -q .; then
              echo "Slurm is ready after ${i}s"
              break
            fi
            sleep 1
          done
          # Wait a bit more for sacct/slurmdbd
          sleep 10
          docker compose exec -T slurmctld sinfo
          docker compose exec -T slurmctld sacct || true

      - name: Copy project into slurmctld container
        run: |
          docker compose -f /tmp/slurm-docker/docker-compose.yml \
            cp . slurmctld:/opt/slurmgrid

      - name: Run integration tests
        working-directory: /tmp/slurm-docker
        run: |
          docker compose exec -T slurmctld \
            python3 /opt/slurmgrid/tests/slurm_integration/run_tests.py \
            /opt/slurmgrid

      - name: Collect logs on failure
        if: failure()
        working-directory: /tmp/slurm-docker
        run: |
          echo "=== slurmctld logs ==="
          docker compose logs slurmctld --tail=50
          echo "=== slurmdbd logs ==="
          docker compose logs slurmdbd --tail=50
          echo "=== mysql logs ==="
          docker compose logs mysql --tail=50

      - name: Save Docker image to cache
        if: always()
        run: |
          mkdir -p /tmp/slurm-docker-cache
          if [ ! -f /tmp/slurm-docker-cache/slurm-docker-cluster.tar ]; then
            IMAGES=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -i slurm | sort -u)
            if [ -n "$IMAGES" ]; then
              echo "Saving images to cache: $IMAGES"
              docker save -o /tmp/slurm-docker-cache/slurm-docker-cluster.tar $IMAGES
            fi
          fi

      - name: Tear down cluster
        if: always()
        working-directory: /tmp/slurm-docker
        run: docker compose down -v
